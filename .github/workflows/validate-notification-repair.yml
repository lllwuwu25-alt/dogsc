name: Validate notification repair
on:
  workflow_dispatch:
  push:
    branches: [compat/intel-ventura]
    paths: [.github/workflows/validate-notification-repair.yml]
permissions:
  contents: write
concurrency:
  group: intel-ventura-${{ github.ref }}
  cancel-in-progress: true
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source patch
        run: |
          python3 - <<'DOGSC_PATCH'
          import base64, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(''))
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          DOGSC_PATCH
          git diff --check
      - name: Packaging and actor regression tests
        run: python3 -m unittest discover -s tests -v
      - name: AppKit and core compatibility tests
        run: |
          set -o pipefail
          xcrun swift test --scratch-path .build/intel --triple x86_64-apple-macosx13.0 2>&1 | tee swift-tests.log
      - name: Commit validated source changes
        run: |
          git add -- Sources Tests tests scripts docs/superpowers/plans/2026-10-22-appkit-notification-crash.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix Ventura notification crashes and synchronous AppKit callbacks'
          git push origin HEAD:compat/intel-ventura
          git rev-parse HEAD
      - name: Build and verify Intel application build 21
        run: |
          set -o pipefail
          bash build-intel.sh 2>&1 | tee intel-build.log
      - name: Upload installable files
        uses: actions/upload-artifact@v4
        with:
          name: DogSC-Intel-app-build21
          path: dist/intel/
          if-no-files-found: error
          retention-days: 14
      - name: Keep compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DogSC-Intel-app-build21-logs
          path: |
            swift-tests.log
            intel-build.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish application build 21
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_commit="$(git rev-parse HEAD)"
          gh release create intel-app-build-21 dist/intel/*.dmg dist/intel/*.zip \
            --title 'DogSC Intel application build 21' \
            --notes "Validated notification crash repair. Source: ${source_commit}. Target: Intel macOS 13+." \
            --prerelease --latest=false

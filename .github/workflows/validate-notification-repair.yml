name: Align build 21 source tag
on:
  workflow_dispatch:
  push:
    branches: [compat/intel-ventura]
    paths: [.github/workflows/validate-notification-repair.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a60c381623aeb0dd0ebe669438e16cdf76d4bc3e
      - name: Tag validated source and align the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag intel-app-build-21-source a60c381623aeb0dd0ebe669438e16cdf76d4bc3e
          git push origin refs/tags/intel-app-build-21-source
          gh api --method PATCH repos/lllwuwu25-alt/dogsc/releases/420190472 -f tag_name=intel-app-build-21-source

name: Publish verified build 21 assets
on:
  workflow_dispatch:
  push:
    branches: [compat/intel-ventura]
    paths: [.github/workflows/validate-notification-repair.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Copy the verified installers to the source-pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download intel-app-build-21-ventura --repo lllwuwu25-alt/dogsc --pattern '*.dmg' --pattern '*.zip' --dir dist
          python3 - <<'DOGSC_CHECK'
          from pathlib import Path
          import hashlib
          expected = {'DogSC-Intel-v0.1.8-macOS13.dmg': '7de34ac96991c66d700f4112b93e476eff9ae9ae211882f2c53e8638a1069bd1', 'DogSC-Intel-v0.1.8-macOS13.zip': '5a31618a8d55f317b2a6b0d9cb5d7ef320ec39dd1c3a424699d61c795960598d'}
          for name, digest in expected.items():
              assert hashlib.sha256((Path('dist') / name).read_bytes()).hexdigest() == digest
              print('Verified', name)
          DOGSC_CHECK
          gh release upload intel-app-build-21-source dist/*.dmg dist/*.zip --repo lllwuwu25-alt/dogsc

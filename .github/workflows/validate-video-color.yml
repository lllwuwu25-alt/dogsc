name: Validate Ventura video color
on:
  workflow_dispatch:
  push:
    branches: [compat/intel-ventura]
    paths: [.github/workflows/validate-video-color.yml]
permissions:
  contents: write
concurrency:
  group: intel-ventura-${{ github.ref }}
  cancel-in-progress: true
jobs:
  intel:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Add regression tests before repair
        run: |
          python3 - <<'PATCH'
          import base64, subprocess, zlib
          patch = zlib.decompress(base64.b64decode(''))
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PATCH
      - name: Reproduce unsupported Ventura writer settings
        run: |
          set -o pipefail
          xcrun swift test --scratch-path .build/intel --triple x86_64-apple-macosx13.0 --filter VideoColorCompatibilityTests 2>&1 | tee color-red-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-color-red-test-log
          path: color-red-tests.log
